<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1117"/>
      <stop offset="1" stop-color="#181C26"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F7C948"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF4D5A"/>
      <stop offset="1" stop-color="#D91F3C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1600" height="86" fill="#111722"/>
  <rect x="22" y="18" width="192" height="48" rx="14" fill="#171E2D" stroke="#2A3548"/>
  <text x="60" y="50" fill="#F5F7FA" font-size="26" font-family="Arial, Helvetica, sans-serif" font-weight="700">MP3</text>
  <text x="123" y="50" fill="#F5C65D" font-size="26" font-family="Arial, Helvetica, sans-serif" font-weight="700">Downloader</text>

  <rect x="940" y="18" width="430" height="48" rx="16" fill="#171E2D" stroke="#2A3548"/>
  <circle cx="967" cy="42" r="9" fill="#F7C948" opacity="0.8"/>
  <text x="986" y="49" fill="#8EA1C1" font-size="20" font-family="Arial, Helvetica, sans-serif">Search music, URL, playlist...</text>

  <circle cx="1452" cy="42" r="22" fill="url(#gold)"/>
  <text x="1438" y="49" fill="#121722" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700">D</text>

  <!-- Sidebar -->
  <rect x="0" y="86" width="260" height="914" fill="#0D1420"/>
  <rect x="15" y="110" width="230" height="56" rx="18" fill="#171E2D" stroke="#2A3548"/>
  <text x="52" y="148" fill="#F7C948" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700">Home</text>

  <rect x="15" y="182" width="230" height="56" rx="18" fill="#111A27" stroke="#1E293B"/>
  <text x="52" y="220" fill="#D9E2F7" font-size="22" font-family="Arial, Helvetica, sans-serif">Download</text>

  <rect x="15" y="254" width="230" height="56" rx="18" fill="#111A27" stroke="#1E293B"/>
  <text x="52" y="292" fill="#D9E2F7" font-size="22" font-family="Arial, Helvetica, sans-serif">Queue</text>

  <rect x="15" y="326" width="230" height="56" rx="18" fill="#111A27" stroke="#1E293B"/>
  <text x="52" y="364" fill="#D9E2F7" font-size="22" font-family="Arial, Helvetica, sans-serif">Settings</text>

  <rect x="15" y="398" width="230" height="56" rx="18" fill="#111A27" stroke="#1E293B"/>
  <text x="52" y="436" fill="#D9E2F7" font-size="22" font-family="Arial, Helvetica, sans-serif">History</text>

  <!-- Main area -->
  <rect x="300" y="120" width="1240" height="820" rx="28" fill="#111A27" stroke="#223048"/>

  <text x="340" y="178" fill="#F3F7FF" font-size="40" font-family="Arial, Helvetica, sans-serif" font-weight="700">Welcome back, Daniel</text>
  <text x="340" y="220" fill="#8EA1C1" font-size="22" font-family="Arial, Helvetica, sans-serif">Your downloads are ready to go. Start a new MP3 conversion or keep working on your queue.</text>

  <!-- Stats cards -->
  <g filter="url(#shadow)">
    <rect x="340" y="250" width="270" height="150" rx="24" fill="#171E2D"/>
    <rect x="340" y="250" width="270" height="8" rx="4" fill="url(#gold)"/>
    <text x="372" y="302" fill="#8EA1C1" font-size="20" font-family="Arial, Helvetica, sans-serif">Today</text>
    <text x="372" y="356" fill="#F7F9FC" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700">15</text>
    <text x="430" y="356" fill="#F7C948" font-size="22" font-family="Arial, Helvetica, sans-serif">downloads</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="250" width="270" height="150" rx="24" fill="#171E2D"/>
    <rect x="640" y="250" width="270" height="8" rx="4" fill="url(#red)"/>
    <text x="672" y="302" fill="#8EA1C1" font-size="20" font-family="Arial, Helvetica, sans-serif">Queued</text>
    <text x="672" y="356" fill="#F7F9FC" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700">08</text>
    <text x="730" y="356" fill="#FF7582" font-size="22" font-family="Arial, Helvetica, sans-serif">items</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="250" width="270" height="150" rx="24" fill="#171E2D"/>
    <rect x="940" y="250" width="270" height="8" rx="4" fill="#5AC8FA"/>
    <text x="972" y="302" fill="#8EA1C1" font-size="20" font-family="Arial, Helvetica, sans-serif">Storage</text>
    <text x="972" y="356" fill="#F7F9FC" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700">4.8G</text>
    <text x="1105" y="356" fill="#6ED7FF" font-size="22" font-family="Arial, Helvetica, sans-serif">used</text>
  </g>

  <!-- Quick actions card -->
  <g filter="url(#shadow)">
    <rect x="340" y="440" width="870" height="180" rx="26" fill="#171E2D"/>
    <text x="374" y="486" fill="#F3F7FF" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Quick Start</text>
    <text x="374" y="522" fill="#8EA1C1" font-size="20" font-family="Arial, Helvetica, sans-serif">Paste a YouTube or SoundCloud link to begin your download.</text>

    <rect x="374" y="550" width="540" height="42" rx="14" fill="#0E1520" stroke="#2A3548"/>
    <text x="396" y="579" fill="#6B7B99" font-size="20" font-family="Arial, Helvetica, sans-serif">https://youtube.com/watch?v=example</text>

    <rect x="940" y="548" width="210" height="52" rx="16" fill="url(#gold)"/>
    <text x="1015" y="582" fill="#101823" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">Download</text>
  </g>

  <!-- Recent activity -->
  <g filter="url(#shadow)">
    <rect x="340" y="650" width="430" height="220" rx="24" fill="#171E2D"/>
    <text x="372" y="692" fill="#F3F7FF" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Recent Activity</text>

    <rect x="370" y="714" width="68" height="68" rx="18" fill="#2D374F"/>
    <text x="391" y="760" fill="#F7C948" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">♫</text>
    <text x="456" y="740" fill="#F3F7FF" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="600">Midnight Echo</text>
    <text x="456" y="770" fill="#8EA1C1" font-size="18" font-family="Arial, Helvetica, sans-serif">Completed • 3:24</text>

    <rect x="370" y="792" width="68" height="68" rx="18" fill="#2D374F"/>
    <text x="392" y="838" fill="#FF7582" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">⏱</text>
    <text x="456" y="818" fill="#F3F7FF" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="600">Morning Mix</text>
    <text x="456" y="848" fill="#8EA1C1" font-size="18" font-family="Arial, Helvetica, sans-serif">Queued • 2 tracks</text>
  </g>

  <!-- Playlist panel -->
  <g filter="url(#shadow)">
    <rect x="800" y="650" width="410" height="220" rx="24" fill="#171E2D"/>
    <text x="832" y="692" fill="#F3F7FF" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Top Playlists</text>

    <rect x="832" y="716" width="350" height="46" rx="14" fill="#0E1520"/>
    <rect x="846" y="728" width="22" height="22" rx="7" fill="#F7C948"/>
    <text x="882" y="748" fill="#F3F7FF" font-size="18" font-family="Arial, Helvetica, sans-serif">Chill Wave</text>
    <text x="1128" y="748" fill="#8EA1C1" font-size="18" font-family="Arial, Helvetica, sans-serif">14 songs</text>

    <rect x="832" y="772" width="350" height="46" rx="14" fill="#0E1520"/>
    <rect x="846" y="784" width="22" height="22" rx="7" fill="#FF7582"/>
    <text x="882" y="804" fill="#F3F7FF" font-size="18" font-family="Arial, Helvetica, sans-serif">Focus Mix</text>
    <text x="1128" y="804" fill="#8EA1C1" font-size="18" font-family="Arial, Helvetica, sans-serif">9 songs</text>

    <rect x="832" y="828" width="350" height="46" rx="14" fill="#0E1520"/>
    <rect x="846" y="840" width="22" height="22" rx="7" fill="#4CC9F0"/>
    <text x="882" y="860" fill="#F3F7FF" font-size="18" font-family="Arial, Helvetica, sans-serif">Podcast Picks</text>
    <text x="1128" y="860" fill="#8EA1C1" font-size="18" font-family="Arial, Helvetica, sans-serif">5 songs</text>
  </g>
</svg>
